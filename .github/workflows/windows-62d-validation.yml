name: ALO APEv2 native validation
run-name: ALO APEv2 / isolated Windows lease and Qt recheck
on:
  push:
    branches: [ci/windows-62d-validation]
permissions:
  contents: read
concurrency:
  group: alo-62d-windows-validation
  cancel-in-progress: false
jobs:
  native-windows:
    if: github.repository == 'DamianPPD/ALO-Music-Public' && github.ref == 'refs/heads/ci/windows-62d-validation'
    runs-on: windows-2022
    timeout-minutes: 28
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: windows
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout diagnostic files
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install exact CPython
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check PySide6==6.10.3 shiboken6==6.10.3 Pillow mutagen requests pytest
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency integrity check failed' }
      - name: Locate native FFmpeg
        run: |
          if (-not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          }
          ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg is unavailable' }
      - name: Fetch exact product baseline
        run: |
          git fetch --no-tags --depth=1 origin c88a18b73f56732d1d906e00beabca2787592a00
          if ($LASTEXITCODE -ne 0) { throw 'Baseline fetch failed' }
      - name: Verify sealed trees and run native RED, GREEN and regressions
        run: |
          python -B .ci/apev2/validate.py lease-recheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ALO-APEv2-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alo-apev2-evidence/
          retention-days: 30
          if-no-files-found: warn
