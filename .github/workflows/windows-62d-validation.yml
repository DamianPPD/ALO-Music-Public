name: ALO 6.2D portable Windows package
run-name: ALO 6.2D PORTABLE / Windows Server 2022 / ${{ github.sha }}

on:
  push:
    branches:
      - ci/windows-62d-validation

permissions:
  contents: read
  actions: read # Download only this run's exact artifact ZIP for relocation proof.

concurrency:
  group: alo-62d-windows-validation
  cancel-in-progress: false

jobs:
  portable-windows:
    if: github.repository == 'DamianPPD/ALO-Music-Public' && github.ref == 'refs/heads/ci/windows-62d-validation'
    runs-on: windows-2022
    timeout-minutes: 120 # Build plus unchanged42x120s upper bound; fail-fast remains unchanged.
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record actual native build environment
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'alo-portable-output'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $volume = Get-Volume -DriveLetter ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE).Substring(0,1))
          [ordered]@{caption=$os.Caption; version=$os.Version; build=$os.BuildNumber; architecture=$os.OSArchitecture; filesystem=[string]$volume.FileSystemType; image=$env:ImageVersion; scope='Windows Server2022, NOT desktop acceptance'} | ConvertTo-Json | Set-Content (Join-Path $out 'environment.json') -Encoding utf8

      - name: Checkout isolated packaging commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Official native build interpreter
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.11.9'
          architecture: x64
          check-latest: false

      - name: Portable packaging contract checks (no Qt)
        run: |
          python -B -m unittest discover -s .ci/62d -p test_portable.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Packaging contract failed' }

      - name: Build offline portable payload on native Windows
        run: |
          python -I -B .ci/62d/portable_build.py build
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed; no ready package' }

      - name: Store candidate ZIP for exact download and relocation validation
        id: package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ALO-Music-6.2D-Windows-TESTY-PORTABLE
          path: ${{ runner.temp }}/alo-portable-build/ALO-Music-6.2D-Windows-TESTY/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Validate exact uploaded ZIP through CMD in a new path with spaces
        env:
          GH_READ_TOKEN: ${{ github.token }}
          PORTABLE_ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
        run: |
          python -I -B .ci/62d/portable_build.py smoke $env:PORTABLE_ARTIFACT_ID
          if ($LASTEXITCODE -ne 0) { throw 'STOP: portable ZIP not verified; inspect evidence' }

      - name: Preserve build, CMD and native evidence even on STOP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ALO-62D-Portable-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/alo-portable-output/*.json
            ${{ runner.temp }}/alo-portable-output/*.log
            ${{ runner.temp }}/alo-portable-output/*.sha256.txt
            ${{ runner.temp }}/alo-portable-output/ALO-62D-Windows-wyniki-*.zip
            ${{ runner.temp }}/ALO Relocated Space 62D/wyniki/ALO-62D-Windows-wyniki-*.zip
            ${{ runner.temp }}/ALO Relocated Space 62D/wyniki/ALO-62D-Windows-wyniki-*.zip.sha256.txt
          if-no-files-found: warn
          retention-days: 30
