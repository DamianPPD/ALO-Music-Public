name: ALO Qt cover native diagnosis
run-name: ALO Qt cover / native weak receiver abort stacks
on:
  push:
    branches: [ci/windows-62d-validation]
permissions:
  contents: read
concurrency:
  group: alo-62d-windows-validation
  cancel-in-progress: false
jobs:
  native-windows:
    if: github.repository == 'DamianPPD/ALO-Music-Public' && github.ref == 'refs/heads/ci/windows-62d-validation'
    runs-on: windows-2022
    timeout-minutes: 38
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: windows
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      ALO_RESTART_TRACE_MODE: stacks
    steps:
      - name: Checkout diagnostic files
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install exact CPython
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.10'
          architecture: x64
          check-latest: false
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check PySide6==6.10.3 shiboken6==6.10.3 Pillow mutagen requests pytest
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency integrity check failed' }
      - name: Install and verify native FFmpeg 9.0.2
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'alo-ffmpeg-9.0.2.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'alo-ffmpeg-9.0.2'
          curl.exe --fail --location --retry 3 --retry-all-errors --max-time 120 -o $archive 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip'
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg download failed' }
          $expected = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) { throw 'FFmpeg archive SHA-256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $dest
          $bin = Join-Path $dest 'ffmpeg-9.0.2-essentials_build/bin'
          & (Join-Path $bin 'ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg is unavailable' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $exe = Join-Path $bin 'ffmpeg.exe'
          "ALO_FFMPEG_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $evidence = Join-Path $env:RUNNER_TEMP 'alo-apev2-timeout'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          "$expected  ffmpeg-9.0.2-essentials_build.zip" | Set-Content -LiteralPath (Join-Path $evidence 'ffmpeg-archive-sha256.txt') -Encoding utf8
      - name: Prepare trusted native debugger
        run: .ci/apev2-timeout/setup-debugger.ps1
      - name: Fetch exact product baseline
        run: |
          git fetch --no-tags --depth=1 origin c88a18b73f56732d1d906e00beabca2787592a00
          if ($LASTEXITCODE -ne 0) { throw 'Baseline fetch failed' }
      - name: Validate the sealed product candidate on native Windows
        run: |
          python -B .ci/apev2-timeout/run-diagnosis.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ALO-Qt-Cover-RED-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alo-apev2-timeout/
          retention-days: 30
          if-no-files-found: warn
