name: ALO Library producer registration closure
run-name: ALO Library / 25 targeted cases / Windows Server2022 / ${{ github.sha }}
on:
  push:
    branches: [ci/windows-62d-validation]
permissions:
  contents: read
  actions: read
concurrency:
  group: alo-62d-windows-validation
  cancel-in-progress: false
jobs:
  native-windows:
    if: github.repository == 'DamianPPD/ALO-Music-Public' && github.ref == 'refs/heads/ci/windows-62d-validation'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout isolated diagnostic branch only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Exact preparation interpreter
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.11.9'
          architecture: x64
          check-latest: false
      - name: Reuse preserved verified runtime and FFmpeg
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13197845647'
          run-id: '41560762508'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/portable-base
          merge-multiple: true
      - name: Verify exact sources and run Library integration
        run: |
          python -I -B .ci/62d/activation_prepare.py
          if ($LASTEXITCODE -ne 0) { throw 'Activation acceptance failed' }
      - name: Preserve all available evidence including after STOP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ALO-Library-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/alo-62d-evidence/
          retention-days: 30
          if-no-files-found: warn
