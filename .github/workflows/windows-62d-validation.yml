name: ALO BEA8 Timeout39 continuation package
run-name: ALO Timeout39 targeted PL EN and watchdog / Windows Server2022 / ${{ github.sha }}
on:
  push:
    branches: [ci/windows-62d-validation]
permissions:
  contents: read
  actions: read
concurrency:
  group: alo-62d-windows-validation
  cancel-in-progress: false
jobs:
  native-windows:
    if: github.repository == 'DamianPPD/ALO-Music-Public' && github.ref == 'refs/heads/ci/windows-62d-validation'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout existing isolated diagnostic branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Exact build interpreter
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.11.9'
          architecture: x64
          check-latest: false
      - name: Reuse preserved verified offline runtime without reinstalling dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '13197845647'
          run-id: '41560762508'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/portable-base
          merge-multiple: true
      - name: Infrastructure selection tests and repackage exact BEA8
        run: |
          python -B .ci/62d/test_timeout39_support.py
          if ($LASTEXITCODE -ne 0) { throw 'Infrastructure contract failed' }
          python -I .ci/62d/repack_timeout39.py
          if ($LASTEXITCODE -ne 0) { throw 'Repack failed' }
      - name: Only targeted native PL EN plus synthetic watchdog proof
        run: |
          python -I .ci/62d/smoke_timeout39.py
          if ($LASTEXITCODE -ne 0) { throw 'Targeted package validation failed' }
      - name: Preserve package and all available results even after STOP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ALO-Timeout39-package-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/timeout39-delivery/*.zip
            ${{ runner.temp }}/timeout39-delivery/*.txt
            ${{ runner.temp }}/timeout39-delivery/*.json
            ${{ runner.temp }}/timeout39-delivery/*.log
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn
