name: ALO BEA8 offline portable package validation
run-name: ALO BEA8 offline portable package validation / Windows Server 2022 / ${{ github.sha }}

on:
  push:
    branches:
      - ci/windows-62d-validation

permissions:
  contents: read

concurrency:
  group: alo-62d-windows-validation
  cancel-in-progress: false

jobs:
  native-windows:
    if: github.repository == 'DamianPPD/ALO-Music-Public' && github.ref == 'refs/heads/ci/windows-62d-validation'
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record real Windows Server environment
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'alo-62d-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $volume = Get-Volume -DriveLetter ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE).Substring(0,1))
          [ordered]@{
            caption = $os.Caption; version = $os.Version; build = $os.BuildNumber
            architecture = $os.OSArchitecture; filesystem = [string]$volume.FileSystemType
            drive_type = [string]$volume.DriveType; runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH; image_os = $env:ImageOS; image_version = $env:ImageVersion
            scope = 'Native Windows Server 2022. NOT Windows 10/11 Desktop.'
          } | ConvertTo-Json | Set-Content (Join-Path $evidence 'environment.json') -Encoding utf8

      - name: Checkout isolated test commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Exact official CPython 3.11.9 x64
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11.9'
          architecture: x64
          check-latest: false

      - name: Build exact offline portable package
        run: |
          python -I .ci/62d/build_portable.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }

      - name: Extract fresh ZIP and exercise exact CMD with spaces, offline and failure paths
        run: |
          python -I .ci/62d/smoke_portable.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CMD validation failed; preserve evidence' }

      - name: Upload complete package and available packaging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ALO-Windows11-FINAL-TEST-package-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/portable-delivery/*.zip
            ${{ runner.temp }}/portable-delivery/*.txt
            ${{ runner.temp }}/portable-delivery/*.json
            ${{ runner.temp }}/portable-delivery/*.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
