name: Windows infrastructure SMOKE (technical only)
on:
  push:
    branches: ['ci/windows-infrastructure-smoke-20261017']
    paths: ['ci/windows-smoke/**', '.github/workflows/windows-infrastructure-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Prepare exact official inputs (no product candidate)
        run: python -B ci/windows-smoke/prepare.py
      - name: Original private CPython bootstrap and native SMOKE
        shell: powershell
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ci/windows-smoke/scripts/start.ps1
          exit $LASTEXITCODE
      - name: Preserve every actual result including STOP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-infrastructure-smoke
          path: ci/windows-smoke/results
          if-no-files-found: warn
          retention-days: 14
